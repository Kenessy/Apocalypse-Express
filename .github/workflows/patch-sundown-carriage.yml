name: Patch Sundown Saloon into Carriages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sundown-carriage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Insert Sundown Saloon section into Operations Manual
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/character-creation.html')
          html = path.read_text(encoding='utf-8')
          marker = 'SUNDOWN_SALOON_V1'

          if marker in html:
              print('Sundown Saloon patch already present.')
              raise SystemExit(0)

