name: Patch Sundown Saloon into Carriages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sundown-carriage.yml'
      - 'Tools/patch_sundown_carriage.py'
      - '.swarm/sundown-saloon-trigger.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch character-creation.html
        run: python Tools/patch_sundown_carriage.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/character-creation.html
          git commit -m "Integrate Sundown Saloon into Carriages tab"
          git push
