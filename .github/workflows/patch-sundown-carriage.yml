          js = r'''

<script>
// SUNDOWN_SALOON_V1 - A/B alcove preview
(function(){
  const data = {
    kitchen: { title: 'Mini-Kitchen', icon: '♨', text: 'Drinks, quick food, emergency team prep.' },
    booth: { title: 'Private Booth', icon: '♟', text: 'Private deals, faction meetings, secrets, debt.' }
  };
  function initSundownSaloon(){
    const alcove = document.getElementById('sundownAlcove');
    const title = document.getElementById('sundownAlcoveTitle');
    const icon = document.getElementById('sundownAlcoveIcon');
    const text = document.getElementById('sundownAlcoveText');
    const buttons = Array.from(document.querySelectorAll('[data-sundown-mode]'));
    if(!alcove || !title || !icon || !text || !buttons.length) return;
    buttons.forEach(btn => btn.addEventListener('click', () => {
      const mode = btn.dataset.sundownMode;
      const next = data[mode] || data.kitchen;
      buttons.forEach(b => b.classList.toggle('is-active', b === btn));
      alcove.dataset.mode = mode;
      title.textContent = next.title;
      icon.textContent = next.icon;
      text.textContent = next.text;
    }));
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initSundownSaloon);
  else initSundownSaloon();
})();
</script>
'''

          footer_idx = html.find('/* FOOTER */')
          if footer_idx == -1:
              style_close = html.find('</style>')
              if style_close == -1:
                  raise SystemExit('Could not locate CSS insertion point')
              html = html[:style_close] + css + html[style_close:]
          else:
              html = html[:footer_idx] + css + '\n' + html[footer_idx:]

          acq_idx = html.find('acquisition-atlas')
          if acq_idx != -1:
              close_idx = html.find('</section>', acq_idx)
              if close_idx == -1:
                  raise SystemExit('Found acquisition-atlas but not its closing section')
              insert_idx = close_idx + len('</section>')
              html = html[:insert_idx] + section + html[insert_idx:]
          else:
              vagon_idx = html.find('id="tab-vagon"')
              if vagon_idx == -1:
                  vagon_idx = html.find("id='tab-vagon'")
              if vagon_idx == -1:
                  raise SystemExit('Could not locate Carriages panel')
              # Insert before the Carriages panel closes by finding the next tab panel after it.
              next_panel = html.find('<section id="tab-cadence"', vagon_idx)
              if next_panel == -1:
                  next_panel = html.find("<section id='tab-cadence'", vagon_idx)
              if next_panel == -1:
                  raise SystemExit('Could not locate insertion boundary after Carriages panel')
              insert_idx = html.rfind('</section>', vagon_idx, next_panel)
              if insert_idx == -1:
                  raise SystemExit('Could not locate Carriages closing section')
              html = html[:insert_idx] + section + html[insert_idx:]

          body_close = html.rfind('</body>')
          if body_close == -1:
              raise SystemExit('Could not locate </body>')
          html = html[:body_close] + js + html[body_close:]

          path.write_text(html, encoding='utf-8')
          print('Inserted Sundown Saloon into docs/character-creation.html')
          PY
