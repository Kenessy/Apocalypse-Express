<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AE · Story Flowchart — Null Meridian</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #0e0c18; color: #f8f5f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ══════════════════════════════════════
   VIEWPORT + WORLD (pan & zoom canvas)
   ══════════════════════════════════════ */
#viewport {
  position: absolute; inset: 0;
  cursor: grab;
  overflow: hidden;
  background:
    radial-gradient(1200px 600px at 20% 10%, rgba(163,139,207,.06), transparent 70%),
    radial-gradient(1000px 500px at 80% 90%, rgba(201,156,90,.06), transparent 70%),
    #0e0c18;
  background-size: 100% 100%;
}
#viewport.panning { cursor: grabbing; }

#world {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}

/* grid background that moves with world */
#grid {
  position: absolute;
  left: -10000px; top: -10000px;
  width: 25000px; height: 25000px;
  background-image:
    linear-gradient(rgba(201,156,90,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,156,90,.04) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════
   EDGES (SVG under nodes)
   ══════════════════════════════════════ */
#edges {
  position: absolute; left: -2000px; top: -2000px;
  width: 10000px; height: 10000px;
  pointer-events: none;
  z-index: 1;
  overflow: visible;
}
#edges path {
  fill: none;
  stroke: rgba(201,156,90,.22);
  stroke-width: 1.5;
}
#edges path.fail { stroke: rgba(255,123,92,.30); stroke-dasharray: 4 4; }
#edges path.succ { stroke: rgba(92,200,92,.30); }
#edges path.choice { stroke: rgba(40,189,216,.30); }
#edges path.main { stroke: rgba(201,156,90,.45); stroke-width: 2; }

/* ══════════════════════════════════════
   NODES
   ══════════════════════════════════════ */
.node {
  position: absolute;
  width: 240px;
  border-radius: 8px;
  font-size: 12px; line-height: 1.45;
  cursor: pointer;
  transition: transform .15s, box-shadow .2s, border-color .2s;
  z-index: 2;
  user-select: none;
}
.node:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(0,0,0,.5), 0 0 0 1px rgba(201,156,90,.4);
  z-index: 10;
}
.node.active {
  box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 0 0 2px rgba(230,207,161,.7);
  z-index: 20;
}

/* type variants */
.node.main     { background: rgba(201,156,90,.12); border: 1px solid rgba(201,156,90,.35); }
.node.narrator { background: rgba(184,176,198,.08); border: 1px solid rgba(184,176,198,.22); }
.node.choice   { background: rgba(40,189,216,.08);  border: 1px solid rgba(40,189,216,.28); }
.node.dice     { background: rgba(255,200,40,.08);  border: 1px solid rgba(255,200,40,.28); }
.node.coll     { background: rgba(92,200,92,.08);   border: 1px solid rgba(92,200,92,.28); }
.node.outcome  { background: rgba(255,123,92,.08);  border: 1px solid rgba(255,123,92,.28); }

.node .thumb {
  width: 100%; aspect-ratio: 2/1; object-fit: cover;
  display: block; filter: brightness(.55) saturate(1.1);
  border-top-left-radius: 7px; border-top-right-radius: 7px;
  border-bottom: 1px solid rgba(201,156,90,.1);
}
.node .thumb-missing {
  width: 100%; aspect-ratio: 2/1;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 4px;
  background:
    repeating-linear-gradient(
      45deg,
      rgba(255,123,92,.06),
      rgba(255,123,92,.06) 10px,
      rgba(255,123,92,.11) 10px,
      rgba(255,123,92,.11) 20px
    );
  border-top-left-radius: 7px; border-top-right-radius: 7px;
  border-bottom: 1px dashed rgba(255,123,92,.35);
  color: #ff7b5c;
  font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase;
}
.node .thumb-missing .ic { font-size: 22px; opacity: .85; line-height: 1; }
.node .thumb-missing .lbl { opacity: .9; }

/* image-status dot on the card header */
.img-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
}
.img-dot.ok   { background: #5cc85c; box-shadow: 0 0 6px rgba(92,200,92,.6); }
.img-dot.miss { background: #ff7b5c; box-shadow: 0 0 6px rgba(255,123,92,.6); }

/* node-level missing flag: subtle outline pulse */
.node.needs-img { border-style: dashed; }

/* filter mode: dim nodes that already have an image */
body.filter-missing .node:not(.needs-img) { opacity: .22; filter: saturate(.5); }
body.filter-missing #edges { opacity: .35; }
body.filter-missing .ctrl-btn#btn-filter-missing,
body.filter-missing .topbar .ctrl-btn#btn-filter-missing {
  background: rgba(255,123,92,.18); border-color: rgba(255,123,92,.55); color: #ff7b5c;
}

.node .body { padding: 10px 12px 12px; }
.node .id {
  font-family: 'Consolas', monospace; font-size: 10px;
  color: #c99c5a; opacity: .7; letter-spacing: .02em;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-bottom: 6px;
}
.node .title { color: #e6cfa1; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.node .short { color: #9a94a8; font-size: 11px; line-height: 1.5; }
.node .short em { color: #28bdd8; font-style: normal; }
.node .short strong { color: #e6cfa1; font-weight: 500; }

.tag {
  font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px; font-weight: 600;
}
.tag.main   { background: rgba(201,156,90,.20); color: #e6cfa1; }
.tag.choice { background: rgba(40,189,216,.20); color: #28bdd8; }
.tag.dice   { background: rgba(255,200,40,.20); color: #ffc828; }
.tag.coll   { background: rgba(92,200,92,.20);  color: #5cc85c; }
.tag.outcome{ background: rgba(255,123,92,.20); color: #ff7b5c; }
.tag.narrator{background: rgba(184,176,198,.15); color: #b8b0c6; }

.status {
  font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-left: auto;
}
.status.done { background: rgba(92,200,92,.18); color: #5cc85c; }
.status.todo { background: rgba(184,176,198,.12); color: #b8b0c6; }

/* zone labels (big headers floating in canvas) */
.zone-label {
  position: absolute;
  color: rgba(201,156,90,.35);
  font-size: 32px; font-weight: 700;
  letter-spacing: .15em; text-transform: uppercase;
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════
   FIXED UI — top bar, controls, detail panel
   ══════════════════════════════════════ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 12px 20px;
  background: linear-gradient(to bottom, rgba(14,12,24,.92), rgba(14,12,24,.0));
  display: flex; align-items: center; gap: 16px;
  z-index: 100; pointer-events: none;
}
.topbar h1 {
  color: #c99c5a; font-size: 16px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase;
}
.topbar .sub { color: #b8b0c6; font-size: 11px; opacity: .7; }
.topbar .ctrl-btn { width: 28px; height: 28px; font-size: 12px; }

.controls {
  position: fixed; bottom: 20px; left: 20px;
  display: flex; gap: 6px; z-index: 100;
}
.ctrl-btn {
  width: 36px; height: 36px; border-radius: 6px;
  background: rgba(14,12,24,.9); border: 1px solid rgba(201,156,90,.22);
  color: #e6cfa1; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.ctrl-btn:hover { background: rgba(201,156,90,.12); border-color: rgba(201,156,90,.5); }

/* legend */
.legend {
  position: fixed; bottom: 20px; right: 20px;
  background: rgba(14,12,24,.92); border: 1px solid rgba(201,156,90,.18);
  border-radius: 8px; padding: 10px 14px;
  display: flex; flex-direction: column; gap: 6px;
  font-size: 10px; color: #b8b0c6;
  z-index: 100;
}
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

/* minimap */
.minimap {
  position: fixed; top: 60px; right: 20px;
  width: 200px; height: 140px;
  background: rgba(5,4,10,.85); border: 1px solid rgba(201,156,90,.22);
  border-radius: 6px; overflow: hidden; z-index: 100;
  cursor: pointer;
}
.minimap-inner { position: relative; width: 100%; height: 100%; }
.minimap .mm-node {
  position: absolute; border-radius: 1px;
}
.minimap .mm-view {
  position: absolute; border: 1.5px solid #c99c5a;
  background: rgba(201,156,90,.08); pointer-events: none;
}

/* detail drawer (slides in from right when node clicked) */
.drawer {
  position: fixed; top: 0; right: -520px;
  width: 500px; height: 100vh;
  background: linear-gradient(135deg, #14111f, #0e0c18);
  border-left: 1px solid rgba(201,156,90,.22);
  box-shadow: -10px 0 40px rgba(0,0,0,.5);
  z-index: 200;
  overflow-y: auto;
  transition: right .3s cubic-bezier(.4,0,.2,1);
  padding: 0;
}
.drawer.open { right: 0; }
.drawer .close {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px; border-radius: 16px;
  background: rgba(201,156,90,.1); border: 1px solid rgba(201,156,90,.3);
  color: #e6cfa1; cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
}
.drawer .close:hover { background: rgba(201,156,90,.2); }
.drawer .hero {
  width: 100%; aspect-ratio: 16/7; object-fit: cover;
  filter: brightness(.7);
}
.drawer .drawer-body { padding: 24px 28px 60px; }
.drawer .drawer-id {
  font-family: 'Consolas', monospace; font-size: 11px;
  color: #c99c5a; opacity: .8;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 10px;
}
.drawer .drawer-title {
  color: #e6cfa1; font-size: 22px; font-weight: 700;
  margin-bottom: 4px; letter-spacing: .02em;
}
.drawer .drawer-sub {
  color: #8a8498; font-size: 13px; font-style: italic;
  margin-bottom: 18px;
}
.drawer .drawer-full {
  color: #c3bdd1; font-size: 14px; line-height: 1.75;
}
.drawer .drawer-full em { color: #28bdd8; font-style: italic; }
.drawer .drawer-full strong { color: #e6cfa1; font-weight: 600; }
.drawer .drawer-full p { margin-bottom: 12px; }
.drawer .drawer-choices {
  margin-top: 24px; padding: 14px 16px;
  background: rgba(40,189,216,.06); border: 1px solid rgba(40,189,216,.18);
  border-radius: 6px;
}
.drawer .drawer-choices .label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
  color: #28bdd8; margin-bottom: 8px;
}
.drawer .drawer-choice {
  font-size: 13px; color: #c3bdd1; padding: 6px 0;
  border-bottom: 1px dashed rgba(40,189,216,.12);
}
.drawer .drawer-choice:last-child { border: none; }

/* hint on first load */
.hint {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(14,12,24,.95); border: 1px solid rgba(201,156,90,.3);
  padding: 20px 28px; border-radius: 8px;
  color: #e6cfa1; font-size: 13px; text-align: center;
  z-index: 300; pointer-events: none;
  animation: hintfade 3s ease-out forwards;
  animation-delay: 1.5s;
}
.hint .hint-kbd {
  display: inline-block; padding: 2px 8px; margin: 0 4px;
  background: rgba(201,156,90,.15); border: 1px solid rgba(201,156,90,.3);
  border-radius: 4px; font-family: monospace; font-size: 11px;
}
@keyframes hintfade {
  0% { opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>Apocalypse Express</h1>
  <span class="sub">Arc 1 · Chapter 1: Null Meridian</span>
  <span class="sub" id="img-counter" style="margin-left:auto; font-family:'Consolas',monospace; pointer-events:auto;"></span>
  <button class="ctrl-btn" id="btn-filter-missing" style="pointer-events:auto;" title="Dim nodes that have images">⚠</button>
</div>

<div class="hint">
  <div>Drag to pan · Scroll to zoom · Click a node for details</div>
</div>

<div id="viewport">
  <div id="world">
    <div id="grid"></div>
    <svg id="edges"></svg>
    <!-- nodes injected by JS -->
  </div>
</div>

<div class="controls">
  <button class="ctrl-btn" id="btn-zoom-in" title="Zoom in">+</button>
  <button class="ctrl-btn" id="btn-zoom-out" title="Zoom out">−</button>
  <button class="ctrl-btn" id="btn-reset" title="Fit to screen">⊡</button>
</div>

<div class="minimap" id="minimap">
  <div class="minimap-inner" id="minimap-inner"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#c99c5a"></div> Main trunk</div>
  <div class="legend-item"><div class="legend-dot" style="background:#b8b0c6"></div> Narration</div>
  <div class="legend-item"><div class="legend-dot" style="background:#28bdd8"></div> Choice</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffc828"></div> Dice check</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5cc85c"></div> Collection / success</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff7b5c"></div> Outcome / fail</div>
</div>

<div class="drawer" id="drawer">
  <button class="close" id="drawer-close">×</button>
  <div id="drawer-content"></div>
</div>

<script>
// ══════════════════════════════════════
// DATA — all nodes + edges
// ══════════════════════════════════════
const NODES = [
  // ═ MAIN TRUNK ═
  { id:'cicero-monologue', x:900, y:0, type:'main', img:'ae-null-meridian.png',
    tag:'▶ wake up', title:'Cicero — Monologue',
    short:'Loops, free will, the nature of choice. <em>"Wake up."</em>',
    full:`Morning, noon, evening — twilight by day, darkness by night... Our life is a loop of shadow and light. An endless loop of — well. But what <em>is</em> a loop? A circuit where we wake up, go to work, then fall asleep. Every day, the same exact thing, around and around — like a hamster in a wheel. Neuron A fires to B, B fires to C, C fires back to A, forever repeating the same cycle.

A circuit where current builds forever... or — until it breaches a threshold? In the brain, a synapse... the signal arcs, spikes, cascades — finally shattering its own cycle. So we are in a loop until we reach... what? Death? Whatever the "desired effect" is? We quit? We die? We get promoted? Anything — <em>anything</em> — to break the loop. But here is the thing: the loop won't change. We have to.

But what is the purpose of said loop? To keep something — us — in it. As long as necessary. We are the same as our brains: looped through space and time, returning to the same place, processing vast amounts in our connections — giving our time and devotion to those we deem worthy, and ignoring those we don't. The whole thing rests on a single, fragile assumption: that we <em>choose</em>.

But whenever we do... it always feels one-sided, doesn't it? We didn't really have a choice. Did we? <em>Or did the loop decide for us?</em>

Light follows darkness, darkness follows light. What is it that breaks us free? What if we step sideways — out of the loop entirely? Anything that breaks the flow is enough. And every loop ends with the same thing... learning. Becoming more than you were, by any means necessary. Learning... ascending.... ascension... opening your eyes and seeing... understanding... waking up... becoming... something more?

<em>Wake up.</em>` },

  { id:'waking-up', x:900, y:240, type:'main', img:'ae-null-meridian-portrait.png',
    tag:'⛯ stand up', title:'Waking — Null Meridian',
    short:'<strong>Cicero</strong> — Obsidian crossroads, fountain, mist. <em>"Let us choose."</em>',
    full:`The mist is rising — slowly, deliberately — from the obsidian landscape. Something fully strange, yet awfully familiar. As if you had been here before... in a dream you never quite finished.

Two main roads once crossed here. Travellers stopped to drink from the fountain — an obsidian basin at the heart of the crossroads, its water still crystal-clear. The traces of the living have long since worn away. Footprints eroded, carts dissolved into dust, voices swallowed by the fog. But the water remains. Pure. Patient.

The land did not decay. Only those who walked it. Now it waits — masterless — for a new soul. Someone willing to step into a new adventure. A new loop. Out of the frying pan and into the fire, as they say.

At least <em>this</em> loop is fast. The roads lead to the same place regardless of the traveller. But it is the one who chooses that carries the meaning. A highway is nothing without its wanderers. A crossroads is nothing without the souls who dare to cross to the other side.

So then — let us choose. Nothing simpler than that.

<em>— Someone, somewhere.</em>` },

  { id:'stand-up', x:900, y:480, type:'main', img:'ae-standup-crossroads.png',
    tag:'◎ look around', title:'Stand Up',
    short:'<strong>Narrator</strong> — Mist, obsidian plain, fountain, old man mumbling. The air smells of nothing.',
    full:`You stand. Your legs hold — barely. The mist curls around your ankles like something alive.

A vast obsidian plain stretches in every direction. Two roads cross here, cutting through the dark glass like old scars. At their centre: a fountain. Black stone, carved with symbols you can't read. Water spills from it — clear, impossibly clean — pooling in a basin that no one has tended for what looks like centuries.

Somewhere to your left, a voice. The old man — still talking. Still philosophising. He hasn't stopped since you woke up. His words drift through the fog like smoke, half-heard, half-understood.

The air smells of nothing. Not clean, not foul. Just... absent. As if scent itself gave up on this place long ago.` },

  { id:'crossroads-choice', x:900, y:720, type:'choice', img:'ae-standup-crossroads.png',
    tag:'3 choices', title:'Crossroads',
    short:'Three things demand your attention.',
    full:`You take it in. The obsidian ground reflects the mist above like a dark mirror. Everything here feels suspended — waiting for you to move first.

Three things demand your attention.`,
    choices:['◎ Survey the landscape','† Talk to the old man','⊙ Examine the fountain'] },

  // ═ FOUNTAIN BRANCH ═ (left column, x=150)
  { id:'examine-fountain', x:150, y:1000, type:'narrator', img:'ae-obelisk-fountain.png',
    tag:'⊙ look closer', title:'Examine the Fountain',
    short:'Basin carved from single obsidian piece. Water crystal-clear — sterile. Remnants at the edge.',
    full:`You walk to the fountain. Up close, the strangeness sharpens. The basin is carved from a single piece of obsidian — no seams, no joints, no mason's marks. The water pours from somewhere inside the obelisk's base, though there's no visible mechanism. It just... flows. As if it always has.

The water is crystal-clear. Not clean the way a mountain stream is clean — clean the way a vacuum is clean. There is nothing <em>in</em> it. No algae, no sediment, no life. The stones beneath it are ancient but unblemished. Not a single patch of moss. Not a single stain.

Around the fountain, the crossroads stretches in four directions. Remnants are scattered at the basin's edge — things people left behind. You kneel down for a closer look.` },

  { id:'fountain-close', x:150, y:1240, type:'choice', img:'ae-fountain-close.png',
    tag:'keep / move on', title:'Fountain — Offerings',
    short:'Coins, rotted cloth, bone die, stone bead. Wishes where no one listens.',
    full:`Coins rest on the bottom of the basin — different sizes, different metals. Copper, silver, something darker. Some round, some square, some shaped like nothing you've seen before. Wishes, thrown into a fountain where no one listens.

The water is impossibly still between the ripples. Not fresh because it's young — fresh because there is <em>nothing here to contaminate it</em>. No soil to cloud it. No insects to drown in it. It is sterile in a way that nature never is.

Around the basin: the remains of travellers. Cloth rotted to grey threads. Wooden crates collapsed into splinters — only the iron fittings remain, rusted into lace. A carved bone die, yellowed and cracked. A metal button. A stone bead, smooth and pale, threaded on nothing.

Small things. Personal things. Left by people who passed through and kept walking. Or people who stopped and never left. Nothing here will tell you which.`,
    choices:['◎ Keep looking → roads','↩ Move on'] },

  { id:'roads-signs', x:150, y:1480, type:'choice',
    tag:'keep / move on', title:'Roads & Signs',
    short:'4 identical roads. Signs in dead languages pointing to places that <em>moved</em>.',
    full:`You walk to the nearest road and follow it a few paces. Then the next. Then the third, the fourth. They are identical — the same width, the same obsidian surface, the same fog swallowing them whole within fifty metres.

But the signs are different. Each road has them — posts driven into cracks in the glass, made from stone, metal, rotting wood. The inscriptions are in languages you've never seen. Some carved deep, some painted in pigments that have almost faded to nothing. Numbers beside words that might be names. Distances, maybe. Directions to places.

But as you study them, a feeling creeps in. An <em>intuition</em>. These distances are wrong. Not because the signs are lying — because the world has <em>moved</em>. Whatever these markers once pointed to has shifted, drifted, dissolved. The places they name are no longer where they were. They may no longer <em>be</em> at all.

You step back from the signs. Not from fear. From the quiet certainty that you are reading directions to a dead world. Signposts to nowhere.`,
    choices:['◎ Keep → desk','↩ Move on'] },

  { id:'fountain-desk', x:150, y:1720, type:'choice',
    tag:'examine / leave', title:'The Collapsed Desk',
    short:'Two scrolls pinned under stone. Brittle parchment. Whether it survives <em>you</em> is another question.',
    full:`A few paces from the fountain, half-swallowed by mist: the remains of a desk. Or a table. Something with legs, once. The wood has collapsed into itself — soft, dark, crumbling. But it was once a workstation. Someone sat here.

On top — pinned beneath a stone that might have been placed deliberately — two scrolls. Rolled tight, sealed with wax that cracked centuries ago. The parchment is brittle, damp, the colour of old bone. One wrong move and they'll disintegrate.

Whatever is written on them has survived this long. Whether it survives <em>you</em> is another question.` },

  { id:'scroll-check-1', x:150, y:1960, type:'dice',
    tag:'🎲 DC 10 Delicacy', title:'First Scroll',
    short:'Wax flakes away. Unroll slowly...',
    full:`You reach for the first scroll. Your fingers hover — then close, gently, around the rolled parchment. It creaks. The wax seal flakes away like ash.

You begin to unroll it. Slowly. The edges are ragged, the surface spotted with damp. The ink beneath is faded but present — lines of text in a script you almost recognise. Almost.` },

  { id:'scroll-safe-1', x:-30, y:2200, type:'dice',
    tag:'🎲 DC 10 (2nd)', title:'First Holds',
    short:'First holds! Set down carefully. Second — worse condition.',
    full:`The parchment holds. The edges crumble, the corners dissolve, but the core survives — enough to read. You set it down carefully on the stone, weighting the corners with debris.

One down. The second scroll waits beside it — in worse condition. Darker, damper, more fragile. You reach for it.` },

  { id:'scroll-lost-1', x:330, y:2200, type:'dice',
    tag:'🎲 DC 10 (2nd)', title:'First Crumbles',
    short:'First sighs apart — brown dust. Gone. Only the second left.',
    full:`The parchment <em>sighs</em> — and comes apart in your hands. Not dramatically. Quietly. The fibres separate, the ink bleeds into nothing, and what was once a document becomes a handful of brown dust sifting through your fingers.

Gone. Whatever it said — gone.

One scroll left. The second. It looks worse than the first — darker, damper. But it's all you have now.` },

  { id:'scroll-revelation', x:-30, y:2440, type:'coll',
    tag:'📜 The Unsent Letter', title:'Revelation',
    short:'Weapons orders. Forest thickening. <em>"Send word to my son. Lock everything if I am not back by dark."</em>',
    full:`The surviving parchment yields its secrets — slowly, grudgingly, in fragments. The script is archaic but not alien. You can make out enough.

It's a ledger. Weapons orders — swords, pikes, crossbow bolts — in quantities that grow with every entry. Dates you can't parse, but the pattern is clear: <em>more, faster, urgent</em>. Beside each order, notes in a hurried hand. <em>"Forest thickening. Night patrols doubled. Road to Ashenmere no longer safe after dusk."</em>

The entries get shorter toward the bottom. Less formal. More afraid. <em>"Shipments delayed — third time this cycle. Eastern road compromised. Requesting reinforcements."</em>

And at the very bottom, in different ink — shakier, personal — a note. Not an order. A message. To a servant, perhaps. Or a friend.

<em>"Send word to my son. Tell them to stay home. Do not let his mother leave the house after twilight. Lock everything if I am not back by dark."</em>

The message was never sent. The wax was never broken from the other side. No one folded it for travel. No one read it. Until now.

You set the parchment down. The wind doesn't touch it. Nothing here touches anything.` },

  { id:'scrolls-dust', x:330, y:2440, type:'outcome',
    tag:'lost forever', title:'Both Dust',
    short:'Two documents that survived centuries, undone by a single touch. Some things are not meant to be found.',
    full:`The second scroll follows the first. It doesn't even pretend to hold — the moment your fingers close, it exhales a puff of brown dust and collapses into nothing.

Both gone. Two documents that survived centuries of silence, undone by a single touch. Whatever was written on them — orders, letters, confessions, warnings — it is now dust on an obsidian floor, indistinguishable from the rest of this dead place.

You stare at the empty desk. At the stone that held them down. At your own hands, still powdered with the remains of someone's last words.

Some things are not meant to be found. Or maybe they were — just not by you. Not today.` },

  // ═ CICERO BRANCH ═ (center, x=900, continues straight down)
  { id:'talk-cicero', x:900, y:1000, type:'narrator', img:'ae-cicero-close.png',
    tag:'† call out', title:'Approach the Old Man',
    short:'Heavy cloak, forgettable. Obsidian quill gleams. He fits — the crossroads grew around him.',
    full:`You approach the old man. He stands a few paces from the fountain, slightly hunched, facing no particular direction. A heavy cloak drapes from his shoulders — the fabric is dark, unremarkable, the kind of thing you'd forget the moment you looked away. There is nothing striking about him. Nothing that would make you look twice.

Except the quill. It catches the light — what little there is — and gleams. The tip is obsidian, honed to a needle point, black and glossy as the ground beneath your feet. It moves across the pages of a small, thick book bound in leather so dark it could be skin. He writes without looking up. Without pausing. As if the words arrive faster than his hand can follow.

The book itself is expensive — that much is clear. The binding is tight, the pages cream-coloured, the edges trimmed clean. It doesn't belong in this place. Neither does the quill. But the man holding them? He fits. He fits <em>perfectly</em> — as if the crossroads grew around him, or he grew out of it.

He hasn't acknowledged you. But he knows you're there. You're certain of it.` },

  { id:'cicero-call-1', x:900, y:1240, type:'narrator',
    tag:'† try louder', title:'First Call',
    short:'You call out. He stirs — barely. Quill pauses, resumes. Not entirely here.',
    full:`You open your mouth. A word — any word — it doesn't matter which. You say something. A greeting, maybe. A question. The shape of the sound leaves your lips and crosses the still air between you.

He stirs. Not a turn, not a look — more like a tremor. The quill pauses for half a heartbeat. His head tilts, barely, the way a sleeper shifts when a door opens in a distant room.

Then the quill resumes. The pages turn. He didn't hear you — or he did, and it wasn't enough to surface from wherever he is. He's not ignoring you. He's simply <em>not entirely here</em>. Like a man dreaming with his eyes open.` },

  { id:'cicero-call-2', x:900, y:1480, type:'narrator',
    tag:'◎ wait and listen', title:'Second Call',
    short:'Raise voice. Nothing. Shadow falls too dark. He is <em>unreachable</em>.',
    full:`You step closer. Raise your voice. Not a shout — but firm. Deliberate. The kind of voice you use when someone is looking through you and you need them to <em>stop</em>.

Nothing. The old man's quill doesn't even pause this time. His shadow falls on the obsidian in a way that seems too dark, too sharp — as if the light bends around him differently than around you. As if he is both here and somewhere else, and neither place has his full attention.

He is not deaf. He is not rude. He is simply <em>unreachable</em> — buried in whatever he's writing, lost in the pages the way a swimmer is lost beneath the surface. You could scream and he would not look up.

Perhaps a different approach.` },

  { id:'cicero-listen', x:900, y:1720, type:'narrator',
    tag:'◎ listen closer', title:'Stop Trying',
    short:'Wait. Watch the quill. Then — quietly — he speaks. Not to you.',
    full:`You stop trying. You stand a few paces away, arms at your sides, and you wait. You watch the quill move. You listen to the scratch of obsidian on parchment. The mist drifts between you.

For a long time, there is nothing but that sound. Scratch. Turn. Scratch. The rhythm of someone working through something that has no end.

And then — so quietly you almost miss it — he speaks. Not to you. To the book. To himself. To something you can't see.` },

  { id:'cicero-mumble', x:900, y:1960, type:'main', img:'ae-cicero-wakeup.png',
    tag:'↩ leave him be', title:'Cicero Mumbles',
    short:'<strong>Cicero</strong> — <em>"...a promise is a promise. They cannot lie — this is known. But for how much longer?"</em>',
    full:`"...but a promise is a promise. He has to honour it. <em>They</em> have to honour it. So that is what we must hope for. They <em>cannot</em> lie — this is known. Not to me. Not them. So here we are..."

A pause. The quill stops. He frowns at something on the page.

"...but for how much longer? Good stories don't keep you waiting — only me... but where am I? Hm..."

The quill resumes. The moment passes. Whatever window was open has closed again.` },

  { id:'cicero-leave', x:900, y:2200, type:'narrator',
    tag:'↩ return', title:'Leave Him Be',
    short:'A promise. Something that <em>cannot lie</em>. He\'ll be here when you return.',
    full:`A promise. Someone — or something — that <em>cannot lie</em>. An obligation that must be honoured. And the old man, here, waiting. Writing. For how long?

He's an interesting man. But he's not ready to talk — not yet. Whatever holds his attention is stronger than you. Stronger than this place, maybe.

You leave him to his pages. The quill scratches on behind you, steady as a heartbeat. He'll be here when you come back. You're sure of that much.` },

  // ═ SCOUT BRANCH ═ (right column)
  { id:'look-around', x:1700, y:1000, type:'choice', img:'ae-s1-bg.png',
    tag:'2 choices', title:'Survey the Landscape',
    short:'Obelisk visible. Need higher ground. Climb it, or find another way.',
    full:`You look up — and the answer is right in front of you. A massive obelisk, carved from obsidian. Monstrous and immovable. It rises from the fountain like a black needle piercing the fog, its surface etched with spiralling symbols that catch no light.

    full:`You step onto the fountain's edge and wade through the shallow water to the base of the obelisk. Cold seeps through your boots. The stone is slick, dark, featureless — until you run your fingers along it and find the first crack.

<em>What happens next is not entirely up to you.</em>` },

  { id:'climb-success', x:1240, y:1480, type:'coll', img:'ae-crossroads-wide.png',

    short:'Endless obsidian plain. Ancient, alien, <em>old</em>. Mystery <strong>revealed</strong>.',
    full:`You pull yourself over the final edge. The wind stops. The mist falls away beneath you like a veil being lifted — and for the first time, you <em>see</em>.

This is an ancient plane. Older than anything you have words for. It operates on rules you do not recognise, built by something you cannot name. It is not hostile. It is not welcoming. It is simply <em>alien</em>. And above all else — it is <em>old</em>.

You have seen enough. You climb back down — slowly, carefully — and return to the crossroads. The view stays with you. It will not leave easily.` },

  { id:'climb-fail-1', x:1520, y:1480, type:'outcome', img:'ae-climb-fall.png',

You fall. The mist swallows you for a heartbeat before the water catches you with a soft, merciful splash. The fountain basin is shallow but deep enough. Cold rushes through your clothes, your bones, your pride.

You stand up. Shake yourself off. Water drips from every part of you. The obelisk looms above — unmoved, unimpressed.

    choices:['⊙ Try again → DC 15','✕ Enough → crossroads'] },

  { id:'climb-attempt-2', x:1520, y:1720, type:'dice', img:'ae-climb-retry.png',

This is the thing about choices: they leave marks. Not just on you — on the world around you. The stone is slicker because you made it slick. The carvings feel narrower because your fingers are swollen from the fall. Every decision reshapes the next one. The difficulty didn't change — <em>you</em> did.

You grit your teeth and climb. Higher this time, faster, before doubt can catch up. The wind bites harder up here. Your arms shake.` },

  { id:'climb-fail-2', x:1520, y:1960, type:'outcome',
    tag:'2 choices', title:'Second Fall',
    short:'Back-first into water. Something <em>unreasonable</em> hasn\'t given up.',
    full:`Your grip fails at the halfway point. The stone doesn't even pretend to hold you this time — it simply lets go. You slide, scraping skin and pride against the wet marble, and hit the water back-first.

The splash is louder this time. Or maybe it's quieter and you just feel it more. You float there for a moment, staring up at the peak dissolving into mist. It looks further away than it did before you started.

Your body is telling you to stop. Your arms are dead weight. Your fingers are bleeding. But there's something else — something <em>unreasonable</em> — that hasn't given up yet.

The obelisk has beaten you twice. If you go again, it won't be skill that gets you to the top. It'll be something else entirely.`,

  { id:'climb-attempt-3', x:1520, y:2200, type:'dice',
    tag:'🎲 DC 20', title:'Third Attempt',
    short:'Don\'t think — just pull. The obelisk is <em>watching</em>. Not a test of strength.',
    full:`You don't think about it. If you think, you'll stop. You grab the stone with hands that can barely close and you <em>pull</em>.

The obelisk is different now. Not physically — the cracks are the same, the marble is the same. But it feels like it's watching. Like it's <em>waiting</em> to see what you do. Two failures have changed the equation. The difficulty isn't in the stone anymore. It's in you. In whether you have anything left that physics can't explain.

Three chances. Three failures. Whatever sits at the top of that column — the view, the answers, the thing you needed to see — it stays hidden. The mist keeps its secrets. Some doors don't open on the third knock. Some doors don't open at all.

You drag yourself from the fountain. Water drains from your clothes in long, heavy streams. The crossroads waits — unchanged, unimpressed. As if nothing happened. As if you never tried.` },

    full:`You turn away from the obelisk and walk into the mist. Carefully. Slowly. Never straying so far that you lose sight of the fountain's faint glow behind you.

The landscape doesn't change. The same obsidian underfoot, the same grey nothing in every direction. You walk for what feels like minutes but could be seconds — distance is meaningless here. The fog eats depth, swallows scale. Everything is always the same distance away: <em>too far to see</em>.

You're about to turn back when you spot it. A shape in the mist — solid, dark, not obsidian. A tree. Thick-trunked, dark-leaved, growing from a crack where soil has gathered over centuries. And at its base: a boulder. Large enough to stand on. High enough that you might — <em>just might</em> — reach the lowest branches.

It's not the obelisk. But it's something.` },

  { id:'tree-climb', x:1920, y:1480, type:'dice', img:'ae-tree-climb.png',
    tag:'🎲 DC 15', title:'Tree Climb',
    short:'Boulder → jump → grab branch. Dark bark, no wind.',
    full:`You climb the boulder. The stone is rough — easier than obsidian, at least. From the top, the lowest branch hangs about a metre above your head. Thick as your thigh, dark and slick with condensation.

The tree is strange. Its bark is almost black, grooved in patterns that look deliberate. The leaves are broad, heavy, and they don't move in the wind — because there is no wind down here. Everything is still.

You coil your legs and jump. Your fingers brush the bark — wet, cold, uncertain. If the branch holds, you're up. If it doesn't...` },

  { id:'tree-success', x:1780, y:1720, type:'coll', img:'ae-tree-top.png',
    tag:'📜 A Glimpse Through the Fog', title:'Branch Holds',
    short:'Partial panorama. Roads visible, horizon hidden. "A glimpse. Not a view."',
    full:`The branch holds. You swing, grip, pull — and you're up. The bark bites into your palms but it's solid. You climb higher, branch by branch, until the canopy opens and your head breaks through the fog.

You see... <em>something</em>. The roads below — four dark lines converging on the crossroads, stretching outward into grey. The fountain, small from here, still catching light. The obelisk, a black needle rising higher than you'll ever get from this tree.

But the horizon — the horizon stays hidden. The fog is thinner up here, not gone. You can see the <em>shape</em> of the world — vast, flat, endless — but not its edges. Not its truth. You know there is more out there. You just can't see it from here.

A glimpse. Not a view. But more than you had before.

You climb down carefully. The branches creak but hold. The boulder accepts you back without comment.` },

  { id:'tree-failed', x:2060, y:1720, type:'outcome', img:'ae-tree-fall.png',
    tag:'destroyed', title:'Branch Snaps — Locked',
    short:'Sharp wet snap. Tree is done with you. No retry.',
    full:`Your fingers close around the branch — and it <em>cracks</em>. Not a slow groan, not a warning. A sharp, wet snap that echoes through the fog like a gunshot.

The branch comes away in your hands. You fall — not far, just off the boulder — but you land hard on the obsidian. The broken branch lands beside you, trailing splinters and dark sap.

You look up. Where the branch was, a pale wound in the bark. The remaining branches are higher now — impossibly so. Even if you climbed the boulder again, there's nothing to grab. The tree is done with you.

This path is closed. Whatever was up there — you won't be seeing it from this tree.` },

  // ─ WANDER FALLBACK (between climb & tree, below)
  { id:'wander-explore', x:1780, y:2200, type:'coll', img:'ae-crossroads-wide.png',
    tag:'📜 The Infinite Plane', title:'Wander & Explore',
    short:'Just walk. No plan. Truth arrives from the ground: <em>it\'s all the same</em>.',
    full:`You walk. No plan, no target, no urgency. Just one foot in front of the other, through the mist, across the obsidian.

You walk for a long time. The crossroads shrinks behind you, then disappears. The fountain's glow fades. There is nothing ahead and nothing behind — just the same dark glass, the same grey air, the same silence that has been here since before anything had a name.

And slowly — so slowly you almost miss it — the truth arrives. Not from above. Not from a vantage point. From the ground. From your feet. From the monotony itself.

<em>It's all the same.</em>

Every direction, every road, every crack in the obsidian — the same. The landscape doesn't hide its secret behind fog or height. It hides it in <em>plain sight</em>. There is nothing to see because there is nothing <em>different</em> to see. An infinite plane of ancient glass, repeating forever, older than thought, indifferent to exploration.

You didn't need to climb. You just needed to walk long enough to understand.

You turn around. The crossroads finds you again — or you find it. The fountain glows. The obelisk stands. Nothing has changed. But you have.` },

const ZONES = [
  { x: 900,  y: -80,  label: 'Main Trunk' },
  { x: 150,  y: 920,  label: 'Fountain' },

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
const viewport = document.getElementById('viewport');
const world    = document.getElementById('world');
const edgesSvg = document.getElementById('edges');
const drawer   = document.getElementById('drawer');
const drawerContent = document.getElementById('drawer-content');

const NODE_W = 240;
const NODE_H = 150; // approx visible height for edge calc; not fixed

// Render zone labels
for (const z of ZONES) {
  const el = document.createElement('div');
  el.className = 'zone-label';
  el.style.left = z.x + 'px';
  el.style.top = z.y + 'px';
  el.textContent = z.label;
  world.appendChild(el);
}

// Render nodes
const nodeElements = {};
let imgOK = 0, imgMiss = 0;
for (const n of NODES) {
  const el = document.createElement('div');
  el.className = 'node ' + n.type + (n.img ? '' : ' needs-img');
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';

  const hasImg = !!n.img;
  if (hasImg) imgOK++; else imgMiss++;

  let html = '';
  if (hasImg) {
    html += `<img class="thumb" src="${n.img}" alt="">`;
  } else {
    html += `<div class="thumb-missing"><div class="ic">⚠</div><div class="lbl">Image needed</div></div>`;
  }
  html += `<div class="body">
    <div class="id">
      <span class="img-dot ${hasImg ? 'ok' : 'miss'}" title="${hasImg ? 'has image' : 'image missing'}"></span>
      <span class="tag ${n.type}">${n.tag}</span>
      <span class="status done">DONE</span>
    </div>
    <div class="title">${n.title}</div>
    <div class="short">${n.short}</div>
  </div>`;
  el.innerHTML = html;
  el.addEventListener('click', e => {
    e.stopPropagation();
    openDrawer(n);
    document.querySelectorAll('.node.active').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
  });
  world.appendChild(el);
  nodeElements[n.id] = el;
}

// Update topbar counter
const counter = document.getElementById('img-counter');
if (counter) {
  counter.innerHTML = `<span style="color:#5cc85c">● ${imgOK}</span> / ${NODES.length} images · <span style="color:#ff7b5c">${imgMiss} needed</span>`;
}

// Render edges after a frame so we can measure heights
function renderEdges() {
  edgesSvg.innerHTML = '';
  for (const e of EDGES) {
    const a = nodeElements[e.from];
    const b = nodeElements[e.to];
    if (!a || !b) continue;
    const ax = parseFloat(a.style.left) + NODE_W/2;
    const ay = parseFloat(a.style.top) + a.offsetHeight;
    const bx = parseFloat(b.style.left) + NODE_W/2;
    const by = parseFloat(b.style.top);
    // SVG is offset by -2000,-2000
    const OX = 2000, OY = 2000;
    const dx = bx - ax;
    const dy = by - ay;
    // Curved path
    const c1x = ax + OX;
    const c1y = ay + OY + Math.abs(dy) * 0.35;
    const c2x = bx + OX;
    const c2y = by + OY - Math.abs(dy) * 0.35;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M ${ax+OX} ${ay+OY} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${bx+OX} ${by+OY}`);
    path.setAttribute('class', e.kind || '');
    edgesSvg.appendChild(path);
  }
}
requestAnimationFrame(renderEdges);

// ══════════════════════════════════════
// PAN + ZOOM
// ══════════════════════════════════════
let tx = 0, ty = 0, scale = 0.7;
let isPanning = false, startX, startY, startTx, startTy;

function applyTransform() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  updateMinimap();
}

viewport.addEventListener('mousedown', e => {
  if (e.target.closest('.node') || e.target.closest('.drawer')) return;
  isPanning = true;
  startX = e.clientX; startY = e.clientY;
  startTx = tx; startTy = ty;
  viewport.classList.add('panning');
});

window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  tx = startTx + (e.clientX - startX);
  ty = startTy + (e.clientY - startY);
  applyTransform();
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  viewport.classList.remove('panning');
});

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const worldX = (cx - tx) / scale;
  const worldY = (cy - ty) / scale;
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  const newScale = Math.max(0.15, Math.min(2, scale * factor));
  scale = newScale;
  tx = cx - worldX * scale;
  ty = cy - worldY * scale;
  applyTransform();
}, { passive: false });

// Controls
document.getElementById('btn-zoom-in').onclick = () => zoomAtCenter(1.2);
document.getElementById('btn-zoom-out').onclick = () => zoomAtCenter(1/1.2);
document.getElementById('btn-reset').onclick = fitToScreen;
document.getElementById('btn-filter-missing').onclick = () => {
  document.body.classList.toggle('filter-missing');
};

function zoomAtCenter(factor) {
  const rect = viewport.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  const worldX = (cx - tx) / scale;
  const worldY = (cy - ty) / scale;
  scale = Math.max(0.15, Math.min(2, scale * factor));
  tx = cx - worldX * scale;
  ty = cy - worldY * scale;
  applyTransform();
}

function fitToScreen() {
  const xs = NODES.map(n => n.x);
  const ys = NODES.map(n => n.y);
  const minX = Math.min(...xs) - 40;
  const maxX = Math.max(...xs) + NODE_W + 40;
  const minY = Math.min(...ys) - 80;
  const maxY = Math.max(...ys) + 200;
  const w = maxX - minX;
  const h = maxY - minY;
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  scale = Math.min(vw / w, vh / h) * 0.92;
  scale = Math.max(0.15, Math.min(1, scale));
  tx = (vw - w * scale) / 2 - minX * scale;
  ty = (vh - h * scale) / 2 - minY * scale;
  applyTransform();
}

// ══════════════════════════════════════
// DRAWER (detail panel)
// ══════════════════════════════════════
document.getElementById('drawer-close').onclick = closeDrawer;
function closeDrawer() {
  drawer.classList.remove('open');
  document.querySelectorAll('.node.active').forEach(x => x.classList.remove('active'));
}
function openDrawer(n) {
  const fullHtml = n.full.split('\n\n').map(p => `<p>${p}</p>`).join('');
  let html = '';
  if (n.img) {
    html += `<img class="hero" src="${n.img}" alt="">`;
  } else {
    html += `<div class="hero" style="
      display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
      color:#ff7b5c;
      background: repeating-linear-gradient(45deg, rgba(255,123,92,.06), rgba(255,123,92,.06) 14px, rgba(255,123,92,.12) 14px, rgba(255,123,92,.12) 28px);">
      <div style="font-size:42px; line-height:1;">⚠</div>
      <div style="font-size:13px; letter-spacing:.15em; text-transform:uppercase; font-weight:600;">Image needed</div>
      <div style="font-size:11px; color:#b8b0c6; font-family:monospace;">no asset for <code>${n.id}</code></div>
    </div>`;
  }
  html += `<div class="drawer-body">
    <div class="drawer-id">
      <span class="img-dot ${n.img ? 'ok' : 'miss'}"></span>
      <span class="tag ${n.type}">${n.tag}</span>
      <span style="opacity:.6">${n.id}</span>
      <span class="status done" style="margin-left:auto">DONE</span>
    </div>
    <div class="drawer-title">${n.title}</div>
    <div class="drawer-sub">${n.short}</div>
    <div class="drawer-full">${fullHtml}</div>`;
  if (n.choices && n.choices.length) {
    html += `<div class="drawer-choices"><div class="label">Player choices</div>`;
    n.choices.forEach(c => { html += `<div class="drawer-choice">${c}</div>`; });
    html += `</div>`;
  }
  html += `</div>`;
  drawerContent.innerHTML = html;
  drawer.classList.add('open');
}

// ══════════════════════════════════════
// MINIMAP
// ══════════════════════════════════════
const minimap = document.getElementById('minimap');
const mmInner = document.getElementById('minimap-inner');
let mmBounds;

function buildMinimap() {
  const xs = NODES.map(n => n.x);
  const ys = NODES.map(n => n.y);
  const minX = Math.min(...xs) - 40;
  const maxX = Math.max(...xs) + NODE_W + 40;
  const minY = Math.min(...ys) - 80;
  const maxY = Math.max(...ys) + 200;
  mmBounds = { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
  mmInner.innerHTML = '';
  for (const n of NODES) {
    const el = document.createElement('div');
    el.className = 'mm-node';
    const x = (n.x - minX) / mmBounds.w * 100;
    const y = (n.y - minY) / mmBounds.h * 100;
    const w = NODE_W / mmBounds.w * 100;
    const h = 150 / mmBounds.h * 100;
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.width = w + '%';
    el.style.height = h + '%';
    const col = {
      main:'#c99c5a', narrator:'#b8b0c6', choice:'#28bdd8',
      dice:'#ffc828', coll:'#5cc85c', outcome:'#ff7b5c'
    }[n.type] || '#888';
    el.style.background = col;
    el.style.opacity = .6;
    if (!n.img) {
      el.style.outline = '1.5px solid #ff7b5c';
      el.style.outlineOffset = '0px';
      el.style.opacity = .9;
    }
    mmInner.appendChild(el);
  }
  const view = document.createElement('div');
  view.className = 'mm-view';
  view.id = 'mm-view';
  mmInner.appendChild(view);
}
buildMinimap();

function updateMinimap() {
  if (!mmBounds) return;
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  // Visible world rect
  const vx1 = -tx / scale;
  const vy1 = -ty / scale;
  const vx2 = vx1 + vw / scale;
  const vy2 = vy1 + vh / scale;
  const view = document.getElementById('mm-view');
  if (!view) return;
  const x = (vx1 - mmBounds.minX) / mmBounds.w * 100;
  const y = (vy1 - mmBounds.minY) / mmBounds.h * 100;
  const w = (vx2 - vx1) / mmBounds.w * 100;
  const h = (vy2 - vy1) / mmBounds.h * 100;
  view.style.left = Math.max(0, x) + '%';
  view.style.top = Math.max(0, y) + '%';
  view.style.width = Math.min(100, w) + '%';
  view.style.height = Math.min(100, h) + '%';
}

minimap.addEventListener('click', e => {
  if (!mmBounds) return;
  const rect = minimap.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width;
  const py = (e.clientY - rect.top) / rect.height;
  const worldX = mmBounds.minX + mmBounds.w * px;
  const worldY = mmBounds.minY + mmBounds.h * py;
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  tx = vw/2 - worldX * scale;
  ty = vh/2 - worldY * scale;
  applyTransform();
});

// ══════════════════════════════════════
// Keyboard shortcuts
// ══════════════════════════════════════
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
  if (e.key === '0' || e.key === 'f' || e.key === 'F') fitToScreen();
  if (e.key === '+' || e.key === '=') zoomAtCenter(1.2);
  if (e.key === '-' || e.key === '_') zoomAtCenter(1/1.2);
});

// initial fit
window.addEventListener('resize', updateMinimap);
setTimeout(() => { fitToScreen(); renderEdges(); }, 50);
</script>
</body>
</html>
